
resources:
  jobs:
    job_inep:
      name: "MBA - INEP - Pipeline"

      max_concurrent_runs: 1

      tasks:
        - task_key: download_landing
          notebook_task:
            notebook_path: ../notebooks/01_ingestao/013_download_landing_inep.ipynb

        - task_key: landing_to_bronze
          depends_on:
            - task_key: download_landing
          notebook_task:
            notebook_path: ../notebooks/01_ingestao/014_landing_to_bronze_inep.ipynb
            base_parameters:
              forcar_reprocessamento: "false"

        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          notebook_task:
            notebook_path: ../notebooks/02_transformacao/024_bronze_to_silver_inep.ipynb

        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/03_analytics/031_silver_to_gold_inep.ipynb
