
resources:
  jobs:
    job_caged:
      name: "MBA - Novo Caged - Pipeline"

      max_concurrent_runs: 1

      tasks:
        - task_key: verificar_novos_arquivos
          notebook_task:
            notebook_path: ../notebooks/01_ingestao/010_verificar_novos_arquivos_caged.ipynb

        - task_key: landing_to_bronze
          depends_on:
            - task_key: verificar_novos_arquivos
          notebook_task:
            notebook_path: ../notebooks/01_ingestao/011_landing_to_bronze_caged.ipynb
            base_parameters:
              competencias_processar: ""

        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          notebook_task:
            notebook_path: ../notebooks/02_transformacao/020_bronze_to_silver_caged.ipynb

        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/03_analytics/030_silver_to_gold_caged.ipynb
