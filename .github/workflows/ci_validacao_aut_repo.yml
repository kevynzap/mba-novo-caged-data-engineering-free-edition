
name: CI - MBA Data Engineering

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat pytest ruff

      - name: Validate Jupyter notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebooks = list(
              Path("notebooks").rglob("*.ipynb")
          )

          for path in notebooks:
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              print(f"OK: {path}")

          print(f"Validated: {len(notebooks)} notebooks")
          PY

      - name: Lint Python modules
        run: |
          ruff check src tests --select E4,E7,E9,F63,F7,F82

      - name: Run tests
        run: |
          python -m pytest tests -q